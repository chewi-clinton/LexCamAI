services:
  postgres:
    image: postgres:17-alpine
    container_name: lexcam-postgres
    environment:
      POSTGRES_USER: lexcam
      POSTGRES_PASSWORD: lexcam_dev
      POSTGRES_DB: postgres
    ports:
      - "5490:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexcam -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: lexcam-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: lexcam-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: lexcam-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: lexcam
      RABBITMQ_DEFAULT_PASS: lexcam_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: minio/minio:latest
    container_name: lexcam-minio
    environment:
      MINIO_ROOT_USER: lexcam
      MINIO_ROOT_PASSWORD: lexcam_dev123
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  embedding-service:
    build:
      context: ./services/embedding-service
      args:
        - MODEL_NAME=intfloat/multilingual-e5-small
    container_name: lexcam-embedding-service
    environment:
      SERVICE_NAME: embedding-service
      API_PREFIX: /api/v1
      MODEL_NAME: intfloat/multilingual-e5-small
      DEVICE: cpu
      MAX_BATCH_SIZE: 64
      MAX_SEQ_LENGTH: 512
      NORMALIZE_EMBEDDINGS: "true"
      LOG_LEVEL: INFO
      REQUIRE_API_KEY: "false"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT: "120/minute"
    ports:
      - "8005:8000"
    volumes:
      - embedding_cache:/cache

  knowledge-base-service:
    build:
      context: ./services/knowledge-base-service
    container_name: lexcam-knowledge-base-service
    environment:
      SERVICE_NAME: knowledge-base-service
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql+psycopg://lexcam:lexcam_dev@postgres:5432/lexcam_knowledge
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_SERVICE_URL: http://embedding-service:8000
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      PLAIN_SUMMARY_CACHE_TTL_SECONDS: 604800
      MAX_SEARCH_RESULTS: 10
    ports:
      - "8003:8000"
    depends_on:
      - postgres
      - qdrant
      - redis
      - embedding-service

  rag-service:
    build:
      context: ./services/rag-service
    container_name: lexcam-rag-service
    environment:
      SERVICE_NAME: rag-service
      API_PREFIX: /api/v1
      KNOWLEDGE_BASE_URL: http://knowledge-base-service:8000
      EMBEDDING_SERVICE_URL: http://embedding-service:8000
      RAG_DATABASE_URL: postgresql://lexcam:lexcam_dev@postgres:5432/lexcam_rag_sessions
      RABBITMQ_URL: amqp://lexcam:lexcam_dev@rabbitmq:5672/%2F
      REDIS_URL: redis://redis:6379/0
      HF_API_KEY: ${HF_API_KEY}
      HF_MODEL: ${HF_MODEL:-google/flan-t5-small}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_API_URL: https://api.groq.com/openai/v1/chat/completions
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GROQ_STREAMING: "true"
      LOG_LEVEL: INFO
    ports:
      - "8004:8000"
    depends_on:
      - postgres
      - rabbitmq
      - redis
      - knowledge-base-service
      - embedding-service

  feedback-service:
    build:
      context: ./services/feedback-service
    image: lexcam-feedback-service
    container_name: lexcam-feedback-service
    environment:
      SERVICE_NAME: feedback-service
      API_PREFIX: /v1
      DATABASE_URL: postgresql://lexcam:lexcam_dev@postgres:5432/lexcam_feedback
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://lexcam:lexcam_dev@rabbitmq:5672/%2F
      CELERY_RESULT_BACKEND: rpc://
      LOG_LEVEL: INFO
    ports:
      - "8010:8000"
    depends_on:
      - postgres
      - redis

  notification-service:
    build:
      context: ./services/notification-service
    image: lexcam-notification-service
    container_name: lexcam-notification-service
    environment:
      SERVICE_NAME: notification-service
      API_PREFIX: /v1
      DATABASE_URL: postgresql://lexcam:lexcam_dev@postgres:5432/lexcam_notif
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://lexcam:lexcam_dev@rabbitmq:5672/%2F
      CELERY_RESULT_BACKEND: rpc://
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      LOG_LEVEL: INFO
    ports:
      - "8011:8000"
    depends_on:
      - postgres
      - redis

  scraper-service:
    build:
      context: ./services/scraper-service
    image: lexcam-scraper-service
    container_name: lexcam-scraper-service
    environment:
      SERVICE_NAME: scraper-service
      API_PREFIX: /v1
      DATABASE_URL: postgresql://lexcam:lexcam_dev@postgres:5432/lexcam_scraping
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: lexcam
      MINIO_SECRET_KEY: lexcam_dev123
      LOG_LEVEL: INFO
      LAWYER_SERVICE_URL: http://lexcam-lawyer-service:8002
      INTERNAL_SERVICE_KEY: dev-internal-key
    ports:
      - "8012:8000"
    depends_on:
      - postgres
      - redis

  feedback-worker:
    image: lexcam-feedback-service
    container_name: lexcam-feedback-worker
    depends_on:
      - feedback-service
      - redis
    command: celery -A app.tasks.celery_app worker -l info -Q default

  notification-worker:
    image: lexcam-notification-service
    container_name: lexcam-notification-worker
    depends_on:
      - notification-service
      - redis
    command: celery -A app.tasks.celery_app worker -l info -Q default

  notification-consumer:
    build:
      context: ./services/notification-service
    container_name: lexcam-notification-consumer
    command: python -u -m app.events_consumer
    restart: on-failure
    environment:
      DATABASE_URL: postgresql://lexcam:lexcam_dev@postgres:5432/lexcam_notif
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://lexcam:lexcam_dev@rabbitmq:5672/%2F
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    depends_on:
      - rabbitmq
      - notification-service
      - postgres

  scraper-worker:
    image: lexcam-scraper-service
    container_name: lexcam-scraper-worker
    environment:
      DATABASE_URL: postgresql://lexcam:lexcam_dev@postgres:5432/lexcam_scraping
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      LAWYER_SERVICE_URL: http://lexcam-lawyer-service:8002
      INTERNAL_SERVICE_KEY: dev-internal-key
      KB_SERVICE_URL: http://lexcam-knowledge-base-service:8000
    depends_on:
      - scraper-service
      - redis
      - postgres
    command: celery -A app.tasks.celery_app worker -l info -Q celery

  user-management:
    build:
      context: ./services/user-management
    container_name: lexcam-user-management
    env_file:
      - ./services/user-management/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgresql://lexcam:lexcam_dev@postgres:5432/lexcam_users
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://lexcam:lexcam_dev@rabbitmq:5672/
    ports:
      - "8001:8001"
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8001"
    depends_on:
      - postgres
      - redis

  lawyer-service:
    build:
      context: ./services/lawyer-service
    container_name: lexcam-lawyer-service
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DB_NAME: lexcam_lawyers
      DB_USER: lexcam
      DB_PASSWORD: lexcam_dev
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      USER_MANAGEMENT_URL: http://user-management:8001
      INTERNAL_SERVICE_KEY: dev-internal-key
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: lexcam
      MINIO_SECRET_KEY: lexcam_dev123
      MINIO_DOCUMENTS_BUCKET: lexcam-lawyer-docs
      MINIO_USE_SSL: "false"
    ports:
      - "8002:8002"
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8002"
    depends_on:
      - postgres
      - redis
      - minio
      - user-management

  document-service:
    build:
      context: ./services/document-service
    container_name: lexcam-document-service
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DB_NAME: lexcam_documents
      DB_USER: lexcam
      DB_PASSWORD: lexcam_dev
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://lexcam:lexcam_dev@rabbitmq:5672/
      USER_MANAGEMENT_URL: http://user-management:8001
      INTERNAL_SERVICE_KEY: dev-internal-key
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: lexcam
      MINIO_SECRET_KEY: lexcam_dev123
    ports:
      - "8006:8006"
    command: sh -c "python manage.py migrate && python manage.py consume_events & python manage.py runserver 0.0.0.0:8006"
    depends_on:
      - postgres
      - redis
      - minio
      - user-management

  payment-service:
    build:
      context: ./services/payment-service
    container_name: lexcam-payment-service
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DB_NAME: lexcam_payments
      DB_USER: lexcam
      DB_PASSWORD: lexcam_dev
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      USER_MANAGEMENT_URL: http://user-management:8001
      INTERNAL_SERVICE_KEY: dev-internal-key
      RABBITMQ_URL: amqp://lexcam:lexcam_dev@rabbitmq:5672/
      CAMPAY_URL: ${CAMPAY_URL}
      CAMPAY_USERNAME: ${CAMPAY_USERNAME}
      CAMPAY_PASSWORD: ${CAMPAY_PASSWORD}
      CAMPAY_WEBHOOK_SECRET: ${CAMPAY_WEBHOOK_SECRET}
      CAMPAY_REDIRECT_URL: ${CAMPAY_REDIRECT_URL}
    ports:
      - "8007:8007"
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8007"
    depends_on:
      - postgres
      - redis
      - user-management

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  embedding_cache:
