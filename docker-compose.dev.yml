services:
  postgres:
    image: postgres:17-alpine
    container_name: lexcam-postgres
    environment:
      POSTGRES_USER: lexcam
      POSTGRES_PASSWORD: lexcam_dev
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexcam"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: lexcam-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: lexcam-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: lexcam-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: lexcam
      RABBITMQ_DEFAULT_PASS: lexcam_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: minio/minio:latest
    container_name: lexcam-minio
    environment:
      MINIO_ROOT_USER: lexcam
      MINIO_ROOT_PASSWORD: lexcam_dev123
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  rabbitmq_data:
  minio_data:
