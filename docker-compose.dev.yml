services:
  postgres:
    image: postgres:17-alpine
    container_name: lexcam-postgres
    environment:
      POSTGRES_USER: lexcam
      POSTGRES_PASSWORD: lexcam_dev
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexcam"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: lexcam-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lexcam-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: lexcam-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: lexcam
      RABBITMQ_DEFAULT_PASS: lexcam_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: lexcam-minio
    environment:
      MINIO_ROOT_USER: lexcam
      MINIO_ROOT_PASSWORD: lexcam_dev123
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: lexcam-minio-init
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command: |
      until mc alias set local http://minio:9000 lexcam lexcam_dev123; do
        echo "Waiting for MinIO..."; sleep 3;
      done
      mc mb --ignore-existing local/lexcam-documents
      mc mb --ignore-existing local/lexcam-scraper-html
      mc anonymous set download local/lexcam-documents
    restart: "no"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: lexcam-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  embedding-service:
    build:
      context: ./services/embedding-service
      args:
        - MODEL_NAME=intfloat/multilingual-e5-small
    container_name: lexcam-embedding-service
    environment:
      SERVICE_NAME: embedding-service
      API_PREFIX: /api/v1
      MODEL_NAME: intfloat/multilingual-e5-small
      DEVICE: cpu
      MAX_BATCH_SIZE: 64
      MAX_SEQ_LENGTH: 512
      NORMALIZE_EMBEDDINGS: "true"
      LOG_LEVEL: INFO
      REQUIRE_API_KEY: "false"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT: "120/minute"
    ports:
      - "8005:8000"
    volumes:
      - embedding_cache:/cache
    restart: unless-stopped

  knowledge-base-service:
    build:
      context: ./services/knowledge-base-service
    container_name: lexcam-knowledge-base-service
    environment:
      SERVICE_NAME: knowledge-base-service
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql+psycopg://lexcam:lexcam_dev@postgres:5432/lexcam_knowledge
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: lexcam_laws
      EMBEDDING_SERVICE_URL: http://embedding-service:8000
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      PLAIN_SUMMARY_CACHE_TTL_SECONDS: 604800
      MAX_SEARCH_RESULTS: 10
    ports:
      - "8003:8000"
    depends_on:
      - postgres
      - qdrant
      - redis
      - embedding-service
    restart: unless-stopped

  rag-service:
    build:
      context: ./services/rag-service
    container_name: lexcam-rag-service
    environment:
      SERVICE_NAME: rag-service
      API_PREFIX: /api/v1
      KNOWLEDGE_BASE_URL: http://knowledge-base-service:8000
      EMBEDDING_SERVICE_URL: http://embedding-service:8000
      RAG_DATABASE_URL: postgresql+psycopg://lexcam:lexcam_dev@postgres:5432/lexcam_rag_sessions
      RABBITMQ_URL: amqp://lexcam:lexcam_dev@rabbitmq:5672/
      HF_API_KEY: ${HF_API_KEY}
      HF_MODEL: ${HF_MODEL:-google/flan-t5-small}
      HF_FALLBACK_MODEL: ${HF_FALLBACK_MODEL:-gpt2}
      GROQ_API_URL: ${GROQ_API_URL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      LOG_LEVEL: INFO
    ports:
      - "8004:8000"
    depends_on:
      - knowledge-base-service
      - embedding-service
      - postgres
      - rabbitmq
    restart: unless-stopped

  user-management:
    build:
      context: ./services/user-management
    container_name: lexcam-user-management
    environment:
      DATABASE_URL: postgresql://lexcam:lexcam_dev@postgres:5432/lexcam_users
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://lexcam:lexcam_dev@rabbitmq:5672/
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key-change-me}
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      OTP_EXPIRE_MINUTES: 10
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-dev-internal-key}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      DJANGO_SETTINGS_MODULE: config.settings.production
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    restart: unless-stopped

  lawyer-service:
    build:
      context: ./services/lawyer-service
    container_name: lexcam-lawyer-service
    environment:
      DB_NAME: lexcam_lawyers
      DB_USER: lexcam
      DB_PASSWORD: lexcam_dev
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://lexcam:lexcam_dev@rabbitmq:5672/
      USER_MANAGEMENT_URL: http://user-management:8001
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-dev-internal-key}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: lexcam
      MINIO_SECRET_KEY: lexcam_dev123
      MINIO_DOCUMENTS_BUCKET: lexcam-documents
      MINIO_USE_SSL: "False"
      DJANGO_SETTINGS_MODULE: config.settings.production
    ports:
      - "8002:8002"
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - minio
      - user-management
    restart: unless-stopped

  lawyer-events-consumer:
    build:
      context: ./services/lawyer-service
    container_name: lexcam-lawyer-events-consumer
    command: ["python", "manage.py", "consume_events"]
    environment:
      DB_NAME: lexcam_lawyers
      DB_USER: lexcam
      DB_PASSWORD: lexcam_dev
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://lexcam:lexcam_dev@rabbitmq:5672/
      USER_MANAGEMENT_URL: http://user-management:8001
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-dev-internal-key}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: lexcam
      MINIO_SECRET_KEY: lexcam_dev123
      MINIO_DOCUMENTS_BUCKET: lexcam-documents
      MINIO_USE_SSL: "False"
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      - lawyer-service
      - rabbitmq
      - redis
    restart: unless-stopped

  document-service:
    build:
      context: ./services/document-service
    container_name: lexcam-document-service
    environment:
      SECRET_KEY: ${DOCUMENT_SECRET_KEY:-dev-secret-key-change-me}
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      DB_NAME: lexcam_documents
      DB_USER: lexcam
      DB_PASSWORD: lexcam_dev
      DB_HOST: postgres
      DB_PORT: 5432
      USER_MANAGEMENT_URL: http://user-management:8001
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-dev-internal-key}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: lexcam
      MINIO_SECRET_KEY: lexcam_dev123
      MINIO_DOCUMENTS_BUCKET: lexcam-documents
      MINIO_USE_SSL: "False"
      DJANGO_SETTINGS_MODULE: config.settings.production
    ports:
      - "8006:8006"
    depends_on:
      - postgres
      - minio
      - user-management
    restart: unless-stopped

  payment-service:
    build:
      context: ./services/payment-service
    container_name: lexcam-payment-service
    environment:
      SECRET_KEY: ${PAYMENT_SECRET_KEY:-dev-secret-key-change-me}
      DB_NAME: lexcam_payments
      DB_USER: lexcam
      DB_PASSWORD: lexcam_dev
      DB_HOST: postgres
      DB_PORT: 5432
      USER_MANAGEMENT_URL: http://user-management:8001
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-dev-internal-key}
      CAMPAY_URL: ${CAMPAY_URL:-https://demo.campay.net/api/}
      CAMPAY_USERNAME: ${CAMPAY_USERNAME}
      CAMPAY_PASSWORD: ${CAMPAY_PASSWORD}
      CAMPAY_WEBHOOK_SECRET: ${CAMPAY_WEBHOOK_SECRET}
      CAMPAY_REDIRECT_URL: ${CAMPAY_REDIRECT_URL:-https://lexcam.cm/payment/callback}
      RABBITMQ_URL: amqp://lexcam:lexcam_dev@rabbitmq:5672/
      DJANGO_SETTINGS_MODULE: config.settings.production
    ports:
      - "8007:8007"
    depends_on:
      - postgres
      - user-management
      - rabbitmq
    restart: unless-stopped

  admin-panel:
    build:
      context: ./services/admin-panel
    container_name: lexcam-admin-panel
    environment:
      SECRET_KEY: ${ADMIN_SECRET_KEY:-dev-secret-key-change-me}
      DB_NAME: lexcam_admin
      DB_USER: lexcam
      DB_PASSWORD: lexcam_dev
      DB_HOST: postgres
      DB_PORT: 5432
      USER_MANAGEMENT_URL: http://user-management:8001
      LAWYER_SERVICE_URL: http://lawyer-service:8002
      DOCUMENT_SERVICE_URL: http://document-service:8006
      PAYMENT_SERVICE_URL: http://payment-service:8007
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-dev-internal-key}
      RABBITMQ_URL: amqp://lexcam:lexcam_dev@rabbitmq:5672/
      DJANGO_SETTINGS_MODULE: config.settings.production
    ports:
      - "8010:8010"
    depends_on:
      - postgres
      - user-management
      - lawyer-service
      - document-service
      - payment-service
      - rabbitmq
    restart: unless-stopped

  notification-service:
    build:
      context: ./services/notification-service
    container_name: lexcam-notification-service
    environment:
      SERVICE_NAME: notification-service
      DATABASE_URL: postgresql://lexcam:lexcam_dev@postgres:5432/lexcam_notif
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MIGRATE_AUTO: "true"
      SECRET_KEY: ${NOTIFICATION_SECRET_KEY:-dev-secret-key-change-me}
      USER_MGMT_URL: http://user-management:8001
      RABBITMQ_URL: amqp://lexcam:lexcam_dev@rabbitmq:5672/
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASSWORD:-}
    ports:
      - "8008:8000"
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - user-management
    restart: unless-stopped

  notification-consumer:
    build:
      context: ./services/notification-service
    container_name: lexcam-notification-consumer
    command: ["python", "-u", "-m", "app.events_consumer"]
    environment:
      SERVICE_NAME: notification-service
      DATABASE_URL: postgresql://lexcam:lexcam_dev@postgres:5432/lexcam_notif
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MIGRATE_AUTO: "true"
      SECRET_KEY: ${NOTIFICATION_SECRET_KEY:-dev-secret-key-change-me}
      USER_MGMT_URL: http://user-management:8001
      RABBITMQ_URL: amqp://lexcam:lexcam_dev@rabbitmq:5672/
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASSWORD:-}
    depends_on:
      - rabbitmq
      - notification-service
    restart: unless-stopped

  feedback-service:
    build:
      context: ./services/feedback-service
    container_name: lexcam-feedback-service
    environment:
      SERVICE_NAME: feedback-service
      DATABASE_URL: postgresql://lexcam:lexcam_dev@postgres:5432/lexcam_feedback
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MIGRATE_AUTO: "true"
      SECRET_KEY: ${FEEDBACK_SECRET_KEY:-dev-secret-key-change-me}
      USER_MGMT_URL: http://user-management:8001
      RABBITMQ_URL: amqp://lexcam:lexcam_dev@rabbitmq:5672/
    ports:
      - "8009:8000"
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - user-management
    restart: unless-stopped

  scraper-service:
    build:
      context: ./services/scraper-service
    container_name: lexcam-scraper-service
    environment:
      SERVICE_NAME: scraper-service
      DATABASE_URL: postgresql://lexcam:lexcam_dev@postgres:5432/lexcam_scraping
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MIGRATE_AUTO: "true"
      SECRET_KEY: ${SCRAPER_SECRET_KEY:-dev-secret-key-change-me}
      RABBITMQ_URL: amqp://lexcam:lexcam_dev@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: lexcam
      MINIO_SECRET_KEY: lexcam_dev123
      MINIO_SCRAPER_BUCKET: lexcam-scraper-html
      MINIO_SECURE: "false"
      SCRAPER_DEFAULT_CITY: Douala
    ports:
      - "8011:8000"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    restart: unless-stopped

  scraper-worker:
    build:
      context: ./services/scraper-service
    container_name: lexcam-scraper-worker
    command: celery -A app.tasks.celery_app worker -l info -Q default
    environment:
      SERVICE_NAME: scraper-service
      DATABASE_URL: postgresql://lexcam:lexcam_dev@postgres:5432/lexcam_scraping
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MIGRATE_AUTO: "true"
      SECRET_KEY: ${SCRAPER_SECRET_KEY:-dev-secret-key-change-me}
      RABBITMQ_URL: amqp://lexcam:lexcam_dev@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: lexcam
      MINIO_SECRET_KEY: lexcam_dev123
      MINIO_SCRAPER_BUCKET: lexcam-scraper-html
      MINIO_SECURE: "false"
      SCRAPER_DEFAULT_CITY: Douala
    depends_on:
      - scraper-service
      - redis
      - minio
    restart: unless-stopped

  doc-worker:
    build:
      context: ./workers/doc-worker
    container_name: lexcam-doc-worker
    environment:
      RABBITMQ_URL: amqp://lexcam:lexcam_dev@rabbitmq:5672/
      DOCUMENT_SERVICE_URL: http://document-service:8006
      USER_MANAGEMENT_URL: http://user-management:8001
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-dev-internal-key}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: lexcam
      MINIO_SECRET_KEY: lexcam_dev123
      MINIO_DOCUMENTS_BUCKET: lexcam-documents
      MINIO_SECURE: "false"
    depends_on:
      - rabbitmq
      - document-service
      - minio
    restart: unless-stopped

  indexing-worker:
    build:
      context: ./workers/indexing-worker
    container_name: lexcam-indexing-worker
    environment:
      RABBITMQ_URL: amqp://lexcam:lexcam_dev@rabbitmq:5672/
      KB_SERVICE_URL: http://knowledge-base-service:8000
      EMBEDDING_SERVICE_URL: http://embedding-service:8000
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-dev-internal-key}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: lexcam_laws
      CHUNK_SIZE: "500"
      CHUNK_OVERLAP: "50"
    depends_on:
      - rabbitmq
      - knowledge-base-service
      - embedding-service
      - qdrant
    restart: unless-stopped

  lawyer-ingest-worker:
    build:
      context: ./workers/lawyer-ingest-worker
    container_name: lexcam-lawyer-ingest-worker
    environment:
      RABBITMQ_URL: amqp://lexcam:lexcam_dev@rabbitmq:5672/
      LAWYER_SERVICE_URL: http://lawyer-service:8002
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-dev-internal-key}
      EXCHANGE: lexcam.events
      DLX_EXCHANGE: lexcam.dlx
      QUEUE: lawyer-ingest-worker.lawyers.scraped
      ROUTING_KEY: lawyers.scraped
      BATCH_SIZE: "20"
    depends_on:
      - rabbitmq
      - lawyer-service
    restart: unless-stopped

  notification-worker:
    build:
      context: ./workers/notification-worker
    container_name: lexcam-notification-worker
    environment:
      RABBITMQ_URL: amqp://lexcam:lexcam_dev@rabbitmq:5672/
      USER_MANAGEMENT_URL: http://user-management:8001
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-dev-internal-key}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FROM_EMAIL: noreply@lexcam.cm
    depends_on:
      - rabbitmq
      - user-management
      - mailhog
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  embedding_cache:
