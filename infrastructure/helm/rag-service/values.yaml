replicaCount: 1

image:
  repository: chewiclinton/rag-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8004

resources:
  requests:
    memory: "256Mi"
    cpu: "150m"
  limits:
    memory: "512Mi"
    cpu: "500m"

config:
  DB_HOST: postgres-rag-svc
  DB_PORT: "5432"
  DB_NAME: lexcam_rag_sessions
  DB_USER: lexcam
  RABBITMQ_URL: amqp://lexcam:lexcam_dev@rabbitmq-svc:5672/
  EMBEDDING_SERVICE_URL: http://embedding-service:8000
  KNOWLEDGE_BASE_URL: http://knowledge-base-service-svc:8003
  USER_MANAGEMENT_URL: http://user-management-svc:8001
  LAWYER_SERVICE_URL: http://lawyer-service-svc:8002
  REDIS_URL: redis://redis-svc:6379/1

secrets:
  RAG_DATABASE_URL: "postgresql://lexcam:lexcam_dev@postgres-rag-svc:5432/lexcam_rag_sessions"
  DB_PASSWORD: "lexcam_dev"
  GROQ_API_KEY: "change-me"

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
