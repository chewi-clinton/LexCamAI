apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rag-service.name" . }}-secret
  labels:
    {{- include "rag-service.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $key, $val := .Values.secrets }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
