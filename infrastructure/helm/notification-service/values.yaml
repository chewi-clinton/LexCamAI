replicaCount: 1

image:
  repository: chewiclinton/notification-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8008

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"

config:
  DB_HOST: postgres-notif-svc
  DB_PORT: "5432"
  DB_NAME: lexcam_notif
  DB_USER: lexcam
  RABBITMQ_URL: amqp://lexcam:lexcam_dev@rabbitmq-svc:5672/
  DJANGO_SETTINGS_MODULE: config.settings.production
  EMAIL_HOST: smtp.gmail.com
  EMAIL_PORT: "587"
  EMAIL_USE_TLS: "True"

secrets:
  DB_PASSWORD: "lexcam_dev"
  SECRET_KEY: "change-me-in-production"
  EMAIL_HOST_USER: "your-smtp-email@gmail.com"
  EMAIL_HOST_PASSWORD: "change-me"

hpa:
  enabled: false
