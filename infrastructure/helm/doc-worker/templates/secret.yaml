{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-secret" (include "doc-worker.name" .)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "doc-worker.name" . }}-secret
  labels:
    {{- include "doc-worker.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $val := .Values.secrets }}
  {{ $key }}: {{ if (and $existing (index $existing.data $key)) }}{{ index $existing.data $key | quote }}{{ else }}{{ $val | b64enc | quote }}{{ end }}
  {{- end }}
