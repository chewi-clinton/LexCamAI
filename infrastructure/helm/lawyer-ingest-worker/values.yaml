image:
  repository: ghcr.io/chewi-clinton/lexcamai/lawyer-ingest-worker
  tag: latest
  pullPolicy: IfNotPresent

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"

config:
  LAWYER_SERVICE_URL: http://lawyer-service:8002
  RABBITMQ_URL: amqp://lexcam:lexcam_dev@rabbitmq-svc:5672/
  EXCHANGE: lexcam.events
  DLX_EXCHANGE: lexcam.dlx
  QUEUE: lawyer-ingest-worker.lawyers.scraped
  ROUTING_KEY: lawyers.scraped
  BATCH_SIZE: "20"

secrets:
  INTERNAL_SERVICE_KEY: "dev-internal-key"
