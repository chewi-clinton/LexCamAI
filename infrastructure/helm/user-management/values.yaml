replicaCount: 1

image:
  repository: chewiclinton/user-management
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8001

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "300m"

# Non-sensitive config — goes into ConfigMap
config:
  DB_NAME: lexcam_users
  DB_HOST: postgres-users-svc
  DB_PORT: "5432"
  DB_USER: lexcam
  REDIS_URL: redis://redis-svc:6379/0
  RABBITMQ_URL: amqp://lexcam:lexcam_dev@rabbitmq-svc:5672/
  DJANGO_SETTINGS_MODULE: config.settings.production
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "30"
  OTP_EXPIRE_MINUTES: "10"
  SMTP_HOST: smtp.gmail.com
  SMTP_PORT: "587"
  ALLOWED_HOSTS: "*"
  SECURE_SSL_REDIRECT: "False"

# Sensitive config — goes into Secret (set these in CI or via --set)
secrets:
  DATABASE_URL: "postgresql://lexcam:lexcam_dev@postgres-users-svc:5432/lexcam_users"
  DB_PASSWORD: "lexcam_dev"
  JWT_SECRET_KEY: "set-via-kubectl"
  INTERNAL_SERVICE_KEY: "dev-internal-key"
  SMTP_USER: "set-via-kubectl"
  SMTP_PASSWORD: "set-via-kubectl"

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
