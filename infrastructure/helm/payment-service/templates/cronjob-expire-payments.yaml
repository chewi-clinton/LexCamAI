apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "payment-service.name" . }}-expire-payments
  labels:
    {{- include "payment-service.labels" . | nindent 4 }}
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: expire-payments
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "manage.py", "expire_pending_payments"]
              envFrom:
                - configMapRef:
                    name: {{ include "payment-service.name" . }}-config
                - secretRef:
                    name: {{ include "payment-service.name" . }}-secret
