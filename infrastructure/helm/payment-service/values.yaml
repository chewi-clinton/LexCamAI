replicaCount: 1

image:
  repository: chewiclinton/payment-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8007

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "300m"

# Non-sensitive config — goes into ConfigMap
config:
  DB_NAME: lexcam_payments
  DB_HOST: postgres-payments-svc
  DB_PORT: "5432"
  DB_USER: lexcam
  RABBITMQ_URL: amqp://lexcam:lexcam_dev@rabbitmq-svc:5672/
  USER_MANAGEMENT_URL: http://user-management-svc:8001
  CAMPAY_URL: https://demo.campay.net/api/
  CAMPAY_REDIRECT_URL: https://lexcam.amino-vault.com/documents/my
  DJANGO_SETTINGS_MODULE: config.settings.production
  ALLOWED_HOSTS: "*"

# Sensitive config — goes into Secret (set these in CI or via --set)
secrets:
  DB_PASSWORD: "lexcam_dev"
  SECRET_KEY: "set-via-kubectl"
  INTERNAL_SERVICE_KEY: "dev-internal-key"
  CAMPAY_USERNAME: "set-via-kubectl"
  CAMPAY_PASSWORD: "set-via-kubectl"
  CAMPAY_WEBHOOK_SECRET: "set-via-kubectl"

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
