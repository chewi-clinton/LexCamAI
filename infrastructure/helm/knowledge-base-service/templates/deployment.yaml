apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "knowledge-base-service.name" . }}
  labels:
    {{- include "knowledge-base-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "knowledge-base-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "knowledge-base-service.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: knowledge-base-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "knowledge-base-service.name" . }}-config
            - secretRef:
                name: {{ include "knowledge-base-service.name" . }}-secret
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
