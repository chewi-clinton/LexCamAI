apiVersion: v1
kind: Service
metadata:
  name: {{ include "knowledge-base-service.name" . }}-svc
  labels:
    {{- include "knowledge-base-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "knowledge-base-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8000
