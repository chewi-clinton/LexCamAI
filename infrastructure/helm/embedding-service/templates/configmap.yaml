apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "embedding-service.fullname" . }}-config
  labels:
    {{- include "embedding-service.labels" . | nindent 4 }}
data:
  SERVICE_NAME: {{ .Values.env.SERVICE_NAME | quote }}
  API_PREFIX: {{ .Values.env.API_PREFIX | quote }}
  MODEL_NAME: {{ .Values.env.MODEL_NAME | quote }}
  DEVICE: {{ .Values.env.DEVICE | quote }}
  MAX_BATCH_SIZE: {{ .Values.env.MAX_BATCH_SIZE | quote }}
  MAX_SEQ_LENGTH: {{ .Values.env.MAX_SEQ_LENGTH | quote }}
  NORMALIZE_EMBEDDINGS: {{ .Values.env.NORMALIZE_EMBEDDINGS | quote }}
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | quote }}
  REQUIRE_API_KEY: {{ .Values.env.REQUIRE_API_KEY | quote }}
  RATE_LIMIT_ENABLED: {{ .Values.env.RATE_LIMIT_ENABLED | quote }}
  RATE_LIMIT: {{ .Values.env.RATE_LIMIT | quote }}
