replicaCount: 1

image:
  repository: chewiclinton/scraper-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8011

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "300m"

config:
  DB_HOST: postgres-scraping-svc
  DB_PORT: "5432"
  DB_NAME: lexcam_scraping
  DB_USER: lexcam
  RABBITMQ_URL: amqp://lexcam:lexcam_dev@rabbitmq-svc:5672/
  MINIO_ENDPOINT: minio-svc:9000
  MINIO_SCRAPER_BUCKET: lexcam-scraper-html

secrets:
  DATABASE_URL: "postgresql://lexcam:lexcam_dev@postgres-scraping-svc:5432/lexcam_scraping"
  DB_PASSWORD: "lexcam_dev"
  SECRET_KEY: "change-me-in-production"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
