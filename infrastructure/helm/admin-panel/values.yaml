replicaCount: 1

image:
  repository: chewiclinton/admin-panel
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8010

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "300m"

# Non-sensitive config — goes into ConfigMap
config:
  DB_NAME: lexcam_admin
  DB_HOST: postgres-admin-svc
  DB_PORT: "5432"
  DB_USER: lexcam
  RABBITMQ_URL: amqp://lexcam:lexcam_dev@rabbitmq-svc:5672/
  USER_MANAGEMENT_URL: http://user-management-svc:8001
  LAWYER_SERVICE_URL: http://lawyer-service-svc:8002
  DOCUMENT_SERVICE_URL: http://document-service-svc:8006
  PAYMENT_SERVICE_URL: http://payment-service-svc:8007
  DJANGO_SETTINGS_MODULE: config.settings.production

# Sensitive config — goes into Secret
secrets:
  DB_PASSWORD: "lexcam_dev"
  SECRET_KEY: "change-me-in-production"
  INTERNAL_SERVICE_KEY: "dev-internal-key"

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
