apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: lexcam
---
# Allows Jenkins to deploy/update services within the lexcam namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins
  namespace: lexcam
rules:
  - apiGroups: ["", "apps", "batch"]
    resources: [deployments, statefulsets, services, pods, pods/log, jobs, configmaps, secrets]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins
  namespace: lexcam
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: lexcam
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-pvc
  namespace: lexcam
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jenkins
  namespace: lexcam
spec:
  serviceName: jenkins-svc
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      serviceAccountName: jenkins
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: fix-permissions
          image: busybox
          command: ["sh", "-c", "chown -R 1000:1000 /var/jenkins_home"]
          volumeMounts:
            - name: data
              mountPath: /var/jenkins_home
        - name: install-trivy
          image: aquasec/trivy:latest
          command: ["cp", "/usr/local/bin/trivy", "/trivy-bin/trivy"]
          volumeMounts:
            - name: trivy-bin
              mountPath: /trivy-bin
      containers:
        - name: jenkins
          image: jenkins/jenkins:lts-jdk17
          ports:
            - containerPort: 8080
              name: web
            - containerPort: 50000
              name: agent
          env:
            - name: JAVA_OPTS
              value: "-Djenkins.install.runSetupWizard=false"
            - name: PATH
              value: "/usr/local/bin:/usr/bin:/bin:/trivy-bin"
          volumeMounts:
            - name: data
              mountPath: /var/jenkins_home
            - name: trivy-bin
              mountPath: /trivy-bin
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jenkins-pvc
        - name: trivy-bin
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins-svc
  namespace: lexcam
spec:
  selector:
    app: jenkins
  ports:
    - name: web
      port: 8080
      targetPort: 8080
    - name: agent
      port: 50000
      targetPort: 50000
  type: ClusterIP
