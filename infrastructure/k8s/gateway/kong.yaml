apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: lexcam
data:
  kong.yml: |
    _format_version: "3.0"
    _transform: true

    services:
      - name: user-management
        url: http://user-management-svc:8001
        routes:
          - name: auth-routes
            paths:
              - /api/v1/auth
            strip_path: false
          - name: users-routes
            paths:
              - /api/v1/users
            strip_path: false

      - name: lawyer-service
        url: http://lawyer-service-svc:8002
        routes:
          - name: lawyers-routes
            paths:
              - /api/v1/lawyers
            strip_path: false
          - name: specializations-route
            paths:
              - /api/v1/specializations
            strip_path: false

      - name: notification-service
        url: http://notification-service-svc:8008
        routes:
          - name: notifications-routes
            paths:
              - /api/v1/notifications
            strip_path: false

      - name: feedback-service
        url: http://feedback-service-svc:8009
        routes:
          - name: feedback-routes
            paths:
              - /api/v1/feedback
            strip_path: false

      - name: scraper-service
        url: http://scraper-service-svc:8011
        routes:
          - name: scraper-routes
            paths:
              - /api/v1/scraper
            strip_path: false

      - name: document-service
        url: http://document-service-svc:8006
        routes:
          - name: documents-routes
            paths:
              - /api/v1/documents
            strip_path: false

      - name: payment-service
        url: http://payment-service-svc:8007
        routes:
          - name: payments-routes
            paths:
              - /api/v1/payments
            strip_path: false

      - name: knowledge-base-service
        url: http://knowledge-base-service-svc:8003
        routes:
          - name: knowledge-routes
            paths:
              - /api/v1/knowledge
            strip_path: false

      - name: rag-service
        url: http://rag-service-svc:8004
        read_timeout: 180000
        write_timeout: 180000
        connect_timeout: 60000
        routes:
          - name: rag-routes
            paths:
              - /api/v1/rag
            strip_path: false
          - name: chat-routes
            paths:
              - /api/v1/chat
            strip_path: false
          - name: query-routes
            paths:
              - /api/v1/query
            strip_path: false

      - name: embedding-service
        url: http://embedding-service:8000
        routes:
          - name: embedding-routes
            paths:
              - /api/v1/embed
            strip_path: false

      - name: grafana-monitoring
        url: http://grafana-svc:3000
        routes:
          - name: grafana-route
            paths:
              - /grafana
            strip_path: false

      - name: prometheus-monitoring
        url: http://prometheus-svc:9090
        routes:
          - name: prometheus-route
            paths:
              - /prometheus
            strip_path: false

      - name: minio-storage
        url: http://minio-svc:9000
        routes:
          - name: minio-storage-route
            paths:
              - /storage
            strip_path: true

      - name: frontend
        url: http://frontend-svc:3000
        routes:
          - name: frontend-routes
            paths:
              - /
            strip_path: false

    consumers:
      - username: lexcam-ops
        basicauth_credentials:
          - username: admin
            password: lexcam_dev

    plugins:
      - name: basic-auth
        service: prometheus-monitoring
        config:
          hide_credentials: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: lexcam
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      containers:
        - name: kong
          image: kong:3.6
          ports:
            - containerPort: 8000
              name: proxy
            - containerPort: 8001
              name: admin
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/declarative/kong.yml
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8000"
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:8001"
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
          volumeMounts:
            - name: kong-config
              mountPath: /kong/declarative
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: kong-config
          configMap:
            name: kong-config
---
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy-svc
  namespace: lexcam
spec:
  selector:
    app: kong
  ports:
    - name: proxy
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: kong-admin-svc
  namespace: lexcam
spec:
  selector:
    app: kong
  ports:
    - name: admin
      port: 8001
      targetPort: 8001
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kong-hpa
  namespace: lexcam
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kong
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
